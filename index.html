<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>O Último Capítulo</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e12;color:#f5e8cc;font-family:system-ui,Arial;overflow:hidden}button,input{font:inherit}button{background:#ad8550;color:#160f0a;border:0;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.4}#screen{position:fixed;inset:0;background:linear-gradient(#15151b,#27201d);display:grid;place-items:center;z-index:5;padding:18px}#panel{max-width:440px;width:100%;background:#201b20;border:1px solid #776044;border-radius:18px;padding:24px;max-height:94vh;overflow:auto}h1{font-family:Georgia,serif;font-size:32px}p{line-height:1.5}input{background:#141116;color:white;border:1px solid #766348;border-radius:8px;padding:12px;width:100%;margin:6px 0 12px}.small{font-size:12px;color:#b5a68e}#game{display:none;position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}#hud span{background:#171318cc;padding:8px;border-radius:8px;font-size:12px}#action{position:absolute;right:16px;bottom:105px}#joy{position:absolute;bottom:24px;left:24px;width:112px;height:112px;border:2px solid #d6bb8777;border-radius:50%;background:#1119;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:#cba16a99}#menu{position:absolute;right:12px;top:58px}#modal{position:absolute;inset:0;background:#000b;display:none;place-items:center;padding:16px}#modal>div{background:#231e22;border:1px solid #ad8550;border-radius:14px;padding:20px;width:min(440px,100%);max-height:85vh;overflow:auto}#close{float:right}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1}.accent{color:#e6b86b}</style></head><body>
<section id="screen"><div id="panel"><h1>📖 O Último Capítulo</h1><p>O Silêncio das 23h</p><p>Uma morte. Seis suspeitos. Uma única sala. O assassino está entre vocês.</p><label>Seu nome</label><input id="name" maxlength="18" placeholder="Digite seu nome"><label>Personagem</label><select id="character" style="width:100%;padding:12px;background:#151217;color:white;margin:8px 0 16px"><option>Henrique — Bibliotecário</option><option>Helena — Herdeira</option><option>Ricardo — Advogado</option><option>Clara — Pesquisadora</option><option>Otávio — Segurança</option><option>Daniel — Escritor</option></select><input id="roomcode" maxlength="6" placeholder="Código da sala (vazio para criar)"><button id="online" style="width:100%;margin-bottom:8px">Criar / entrar em sala online</button><button id="start" style="width:100%">Teste solo</button><p class="small">Protótipo local: movimento e pistas funcionam neste aparelho. Salas multiplayer e sorteio seguro de assassino ainda não estão implementados.</p></div></section>
<div id="game"><canvas id="view"></canvas><div id="hud"><span id="role">🔎 Investigador · protótipo</span><span id="found">Pistas: 0/6</span></div><button id="menu">Caderno</button><button id="onlineMenu" style="position:absolute;right:12px;top:108px;display:none">Sala / chat</button><div id="joy"><div id="knob"></div></div><button id="action">Examinar</button><div id="modal"><div><button id="close">✕</button><h2 id="mt"></h2><p id="mb"></p><div class="row" id="choices"></div></div></div></div>
<script>
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let W,H,x=0,z=0,angle=0,move=0,turn=0,found=new Set(),active=null,drag=null,started=false,online=false,ws=null,myId=null,host=false,phase='lobby',players=[],roomCode='',role='',chatLog=[];
const clues=[{x:-3.1,z:-2.4,n:'Carta rasgada',t:'Uma carta parcialmente queimada menciona uma mudança no testamento.'},{x:2.9,z:-2.6,n:'Relógio antigo',t:'O relógio parou às 22h47, antes do suposto apagão.'},{x:-3,z:2.5,n:'Livro vermelho',t:'Dentro do livro há uma anotação: “O manuscrito nunca saiu desta sala”.'},{x:3,z:2.5,n:'Copo de cristal',t:'Há um resíduo estranho no copo. Ainda não sabemos o que significa.'},{x:0,z:-3,n:'Escrivaninha',t:'Uma gaveta foi aberta às pressas. Falta uma página do inventário.'},{x:0,z:3,n:'Porta trancada',t:'A fechadura está intacta. A chave estava do lado de dentro.'}];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);
function show(t,b,buttons=[]){$('mt').textContent=t;$('mb').textContent=b;$('choices').replaceChildren();buttons.forEach(([label,fn])=>{let bt=document.createElement('button');bt.textContent=label;bt.onclick=fn;$('choices').append(bt)});$('modal').style.display='grid'}function hide(){$('modal').style.display='none'}$('close').onclick=hide;
$('start').onclick=()=>{if(!$('name').value.trim())return alert('Digite seu nome');$('screen').style.display='none';$('game').style.display='block';started=true;resize();show('Como jogar — sem spoilers','1. Todos entram na mesma sala e escolhem personagens.\n\n2. Quando o multiplayer estiver disponível, um participante receberá em segredo o papel de assassino. Os demais deverão descobrir quem é.\n\n3. Explore a sala em primeira pessoa: use o controle à esquerda para andar, deslize o dedo na tela para olhar e toque em Examinar perto de objetos.\n\n4. Consulte o Caderno para rever as pistas. Na versão multiplayer, conversem, desconfiem e votem no suspeito ao final.\n\n5. Não compartilhe sua informação secreta se for o assassino. Nenhum jogador recebe a solução antecipadamente.\n\nNeste protótipo solo você pode testar os controles e encontrar seis pistas. Ainda não há sorteio, votação nem partida online.',[['Entendi — iniciar teste',()=>{show('23h — O grito','Augusto Valença foi encontrado morto nesta sala. Explore os objetos e descubra as seis pistas.',[['Investigar',hide]])}]]);requestAnimationFrame(frame)};
function project(px,pz){let dx=px-x,dz=pz-z,side=dx*Math.cos(angle)-dz*Math.sin(angle),depth=dx*Math.sin(angle)+dz*Math.cos(angle);return {sx:W/2+side/(Math.max(.12,depth))*W*.62,depth}}function wall(ax,az,bx,bz,color){let a=project(ax,az),b=project(bx,bz);if(a.depth<=.1&&b.depth<=.1)return;let da=Math.max(.12,a.depth),db=Math.max(.12,b.depth),ya=H*.5-H*.62/da,yb=H*.5-H*.62/db,fa=H*.5+H*.62/da,fb=H*.5+H*.62/db;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(a.sx,ya);ctx.lineTo(b.sx,yb);ctx.lineTo(b.sx,fb);ctx.lineTo(a.sx,fa);ctx.fill();ctx.strokeStyle='#9c79404d';ctx.stroke()}
function frame(){if(!started)return;let dt=.016;angle+=turn*dt*1.9;x+=Math.sin(angle)*move*dt*2;z+=Math.cos(angle)*move*dt*2;x=Math.max(-3.65,Math.min(3.65,x));z=Math.max(-3.65,Math.min(3.65,z));ctx.fillStyle='#27212b';ctx.fillRect(0,0,W,H/2);ctx.fillStyle='#49362a';ctx.fillRect(0,H/2,W,H/2);let walls=[[-4,-4,4,-4,'#49382e'],[4,-4,4,4,'#36291f'],[4,4,-4,4,'#49382e'],[-4,4,-4,-4,'#36291f']];walls.sort((a,b)=>((a[0]+a[2])/2-x)**2+((a[1]+a[3])/2-z)**2-(((b[0]+b[2])/2-x)**2+((b[1]+b[3])/2-z)**2)).reverse().forEach(w=>wall(...w));let nearest=null,dist=99;clues.forEach((c,i)=>{let p=project(c.x,c.z),d=Math.hypot(c.x-x,c.z-z);if(p.depth>.25){let size=Math.min(90,120/p.depth);ctx.fillStyle=found.has(i)?'#668f72':'#d6a65c';ctx.fillRect(p.sx-size/2,H/2-size/2,size,size);ctx.fillStyle='#1d1510';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText('✦',p.sx,H/2+4);if(d<1.5&&Math.abs(p.sx-W/2)<W*.28&&d<dist){nearest=i;dist=d}}});active=nearest;$('action').disabled=nearest===null;$('action').textContent=nearest===null?'Aproxime-se':'Examinar: '+clues[nearest].n;ctx.strokeStyle='#e8d8b4';ctx.beginPath();ctx.moveTo(W/2-8,H/2);ctx.lineTo(W/2+8,H/2);ctx.moveTo(W/2,H/2-8);ctx.lineTo(W/2,H/2+8);ctx.stroke();requestAnimationFrame(frame)}
$('action').onclick=()=>{if(active===null)return;found.add(active);if(online&&ws?.readyState===1)ws.send(JSON.stringify({type:'clue',index:active}));$('found').textContent='Pistas: '+found.size+'/6';let c=clues[active];show(c.n,c.t,found.size===6?[['Ver caderno',notebook]]:[])};function notebook(){show('Caderno de investigação',clues.map((c,i)=>(found.has(i)?'✓ ':'○ ')+c.n+(found.has(i)?': '+c.t:'')).join('\n\n')+'\n\nMultiplayer, suspeitos e votação serão adicionados na próxima etapa.')} $('menu').onclick=notebook;$('mb').style.whiteSpace='pre-line';
$('joy').addEventListener('pointerdown',e=>{drag=e.pointerId;$('joy').setPointerCapture(drag)});$('joy').addEventListener('pointermove',e=>{if(e.pointerId!==drag)return;let r=$('joy').getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/42,dy=(e.clientY-r.top-r.height/2)/42;move=-Math.max(-1,Math.min(1,dy));turn=Math.max(-1,Math.min(1,dx));$('knob').style.transform='translate('+Math.max(-30,Math.min(30,dx*30))+'px,'+Math.max(-30,Math.min(30,dy*30))+'px)'});function release(){drag=null;move=turn=0;$('knob').style.transform=''}$('joy').addEventListener('pointerup',release);$('joy').addEventListener('pointercancel',release);
let look=null;canvas.addEventListener('pointerdown',e=>{look={id:e.pointerId,x:e.clientX};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(look&&e.pointerId===look.id){angle+=(e.clientX-look.x)*.006;look.x=e.clientX}});canvas.addEventListener('pointerup',()=>look=null);addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')move=1;if(e.key==='s'||e.key==='ArrowDown')move=-1;if(e.key==='a'||e.key==='ArrowLeft')turn=-1;if(e.key==='d'||e.key==='ArrowRight')turn=1});addEventListener('keyup',()=>{move=turn=0});

$('online').onclick=()=>{let name=$('name').value.trim();if(!name)return alert('Digite seu nome');ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'join',name,character:$('character').value,code:$('roomcode').value}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')return show('Aviso',m.message);if(m.type==='joined'){myId=m.id;host=m.host;roomCode=m.code;online=true;$('screen').style.display='none';$('game').style.display='block';$('onlineMenu').style.display='block';started=true;resize();requestAnimationFrame(frame);show('Como jogar — sala '+roomCode,'Compartilhe o código com outros jogadores. São necessárias pelo menos duas pessoas. Um participante receberá secretamente o papel de assassino. Investiguem, conversem e votem ao final. Não mostre sua tela de papel secreto.',[['Ver sala',onlinePanel]]);}if(m.type==='state'){phase=m.phase;players=m.players;if(phase==='vote')onlinePanel();if(phase==='play'&&!role)onlinePanel()}if(m.type==='role'){role=m.role;$('role').textContent=role==='assassino'?'🔒 Papel secreto recebido':'🔎 Papel secreto recebido';show('Seu papel — NÃO MOSTRE AOS OUTROS',m.role==='assassino'?'VOCÊ É O ASSASSINO. Sua missão é escapar da votação. Você pode mentir, mas não alterar pistas.':'VOCÊ É INVESTIGADOR. Encontre pistas e descubra o assassino.',[['Entendi',hide]])}if(m.type==='clueFound')chatLog.push(m.by+' examinou uma pista.');if(m.type==='chat')chatLog.push(m.by+': '+m.message);if(m.type==='end'){let culprit=m.players.find(p=>p.id===m.killer),acc=m.players.find(p=>p.id===m.accused);show('Revelação final',(m.win?'Os investigadores acertaram!':'O assassino escapou!')+'\\nAssassino: '+(culprit?.name||'?')+'\\nAcusado: '+(acc?.name||'Empate / sem decisão'),[['Fechar',hide]])}};ws.onclose=()=>{if(online)show('Conexão encerrada','A conexão com a sala foi perdida. Recarregue a página para entrar novamente.')}};
function onlinePanel(){if(!online)return;let text='Código: '+roomCode+'\\nFase: '+phase+'\\n\\nParticipantes:\\n'+players.map(p=>'• '+p.name+' — '+p.character).join('\\n')+'\\n\\n'+chatLog.slice(-8).join('\\n');let actions=[];if(phase==='lobby'&&host)actions.push(['Começar partida',()=>ws.send(JSON.stringify({type:'start'}))]);if(phase==='play'){actions.push(['Enviar mensagem',()=>{let msg=prompt('Mensagem para todos:');if(msg)ws.send(JSON.stringify({type:'chat',message:msg}));onlinePanel()}]);if(host)actions.push(['Iniciar votação',()=>ws.send(JSON.stringify({type:'voteStart'}))])}if(phase==='vote')players.filter(p=>p.id!==myId).forEach(p=>actions.push(['Votar: '+p.name,()=>{ws.send(JSON.stringify({type:'vote',target:p.id}));show('Voto enviado','Aguarde os demais participantes.')} ]));show('Sala online',text,actions)}
$('onlineMenu').onclick=onlinePanel;
</script></body></html>
